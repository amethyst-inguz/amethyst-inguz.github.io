<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm py-6">
        <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900"></h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 w-full">
        <div class="text-center mb-16">
            <h2 class="text-4xl font-extrabold mb-4 text-gray-900">Discover Our Apps</h2>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">
                Explore our collection of apps designed to make your everyday life better. Available now on the Google
                Play Store.
            </p>
        </div>

        <!-- Apps Grid -->
        <div id="apps-container" class="flex flex-wrap justify-center items-stretch gap-8">
            <!-- App Cards will be dynamically injected here by the JavaScript below -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-8">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm text-gray-500">
            <p>Contact us at <strong><a href="mailto:amethyst.inguz@gmail.com">amethyst.inguz</a></strong></p>
            &copy; <span id="year"></span> All rights reserved.
        </div>
    </footer>

    <!-- Configuration Script -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const apps = [
            {
                name: "Faro",
                description: "Discover and navigate your world with Faro. The ultimate companion for your everyday adventures.",
                iconUrl: "assets_l/faro.png",
                playStoreUrl: "https://play.google.com/store/apps/details?id=com.amethyst.faro"
            },
            {
                name: "RecVault",
                description: "Securely store, organize, and manage your personal recordings in an encrypted vault.",
                iconUrl: "assets_l/recvault.png",
                playStoreUrl: "https://play.google.com/store/apps/details?id=com.amethyst.recvault"
            }
        ];

        // Function to render the apps dynamically
        const container = document.getElementById('apps-container');

        apps.forEach(app => {
            // Create the card container
            const card = document.createElement('div');
            card.className = "w-full sm:w-80 lg:w-[350px] bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 flex flex-col h-full";

            // Insert the HTML structure for the card
            card.innerHTML = `
                <div class="p-8 flex-grow flex flex-col items-center text-center">
                    <!-- App Icon -->
                    <div class="w-32 h-32 mb-6 shrink-0 relative group">
                        <img src="${app.iconUrl}" 
                             alt="${app.name} icon" 
                             class="w-full h-full rounded-[28px] object-cover shadow-md border border-gray-100 group-hover:scale-105 transition-transform duration-300">
                    </div>
                    
                    <!-- App Info -->
                    <h3 class="text-2xl font-bold mb-3 text-gray-900">${app.name}</h3>
                    <p class="text-gray-600 mb-8 flex-grow leading-relaxed">${app.description}</p>
                    
                    <!-- Play Store Button Wrapper -->
                    <!-- Adjust the 'height' or 'max-height' here to perfectly size the badge -->
                    <div class="mt-auto flex justify-center" style="height: auto; max-height: 60px; width: 100%;">
                        <a href='${app.playStoreUrl}' target="_blank" class="inline-block transition-transform hover:scale-105 h-full" style="height: 100%;">
                            <img alt='Get it on Google Play' src='https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg' class="h-full w-auto drop-shadow-sm object-contain"/>
                        </a>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>

</html>
